<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإشعارات - WH App</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  direction:rtl;
  background:#FAF3E0;
  color:#2F3E46;
}

.page{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding-bottom:95px;
}

.topbar{
  background:#A3B18A;
  color:white;
  padding:16px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:20;
}

.back-btn{
  background:white;
  color:#344E41;
  border:none;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:20px;
  cursor:pointer;
}

.hero{
  margin:16px;
  background:#EDE0D4;
  border-radius:28px;
  padding:22px 18px;
  text-align:center;
}

.hero-title{
  font-size:28px;
  font-weight:bold;
  color:#344E41;
  margin-bottom:8px;
}

.hero-sub{
  color:#6B705C;
  font-size:14px;
  line-height:1.8;
}

.notifications{
  padding:0 16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.notification-card{
  background:white;
  border-radius:24px;
  padding:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.05);
  border-right:6px solid #A3B18A;
}

.notification-title{
  font-size:18px;
  font-weight:bold;
  color:#344E41;
  margin-bottom:8px;
}

.notification-message{
  color:#555;
  font-size:14px;
  line-height:1.8;
  margin-bottom:10px;
}

.notification-time{
  color:#888;
  font-size:12px;
}

.empty{
  background:white;
  margin:0 16px;
  border-radius:22px;
  padding:28px 18px;
  text-align:center;
  color:#777;
  line-height:1.8;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-top:1px solid #e8dfcf;
  z-index:999;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item div{
  font-size:20px;
  margin-bottom:4px;
}

.nav-item.active{
  color:#344E41;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <button class="back-btn" onclick="history.back()">→</button>
    <div>الإشعارات</div>
    <div style="width:38px"></div>
  </div>

  <div class="hero">
    <div class="hero-title">إشعاراتك 🔔</div>
    <div class="hero-sub">
      تابعي تحديثات الطلبات والتنبيهات الخاصة بحسابك.
    </div>
  </div>

  <div class="notifications" id="notificationsContainer">
    <div class="empty">جاري تحميل الإشعارات...</div>
  </div>

</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="window.location.href='index.html'">
    <div>🏠</div>
    <span>الرئيسية</span>
  </div>

  <div class="nav-item" onclick="window.location.href='orders.html'">
    <div>📦</div>
    <span>طلباتي</span>
  </div>

  <div class="nav-item active" onclick="window.location.href='notifications.html'">
    <div>🔔</div>
    <span>الإشعارات</span>
  </div>

  <div class="nav-item" onclick="window.location.href='profile.html'">
    <div>👤</div>
    <span>حسابي</span>
  </div>
</div>

<script>
const notificationsContainer = document.getElementById("notificationsContainer");

function getToken(){
  return sessionStorage.getItem("token");
}

function authHeaders(){
  return {
    "Authorization": `Bearer ${getToken()}`
  };
}

function formatDate(dateString){
  const date = new Date(dateString);

  return date.toLocaleDateString("ar-EG") +
    " - " +
    date.toLocaleTimeString("ar-EG",{
      hour:"2-digit",
      minute:"2-digit"
    });
}

async function markNotificationsAsRead(){
  try{
    await fetch("/api/notifications/read",{
      method:"PUT",
      headers:authHeaders()
    });
  }catch(err){
    console.error(err);
  }
}

async function loadNotifications(){
  const token = getToken();

  if(!token){
    notificationsContainer.innerHTML = `
      <div class="empty">
        يجب تسجيل الدخول أولًا.
      </div>
    `;
    return;
  }

  try{
    const response = await fetch("/api/notifications",{
      headers:authHeaders()
    });

    const data = await response.json();

    if(!response.ok){
      notificationsContainer.innerHTML = `
        <div class="empty">
          فشل تحميل الإشعارات.
        </div>
      `;
      return;
    }

    if(!data.length){
      notificationsContainer.innerHTML = `
        <div class="empty">
          لا توجد إشعارات حاليًا.
        </div>
      `;
      return;
    }

    notificationsContainer.innerHTML = "";

    data.forEach(notification=>{
      const card = document.createElement("div");
      card.className = "notification-card";

      card.innerHTML = `
        <div class="notification-title">
          ${notification.title}
        </div>

        <div class="notification-message">
          ${notification.message}
        </div>

        <div class="notification-time">
          ${formatDate(notification.created_at)}
        </div>
      `;

      notificationsContainer.appendChild(card);
    });

    markNotificationsAsRead();

  }catch(err){
    console.error(err);

    notificationsContainer.innerHTML = `
      <div class="empty">
        فشل الاتصال بالسيرفر.
      </div>
    `;
  }
}

loadNotifications();
</script>

</body>
</html>
