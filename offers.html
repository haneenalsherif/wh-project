<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العروض - WH App</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  direction:rtl;
  background:#FAF3E0;
  color:#2F3E46;
}

.page{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding-bottom:95px;
}

.topbar{
  background:#A3B18A;
  color:white;
  padding:16px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:20;
}

.back-btn{
  background:white;
  color:#344E41;
  border:none;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:20px;
  cursor:pointer;
}

.hero{
  margin:16px;
  background:#EDE0D4;
  border-radius:28px;
  padding:22px 18px;
  text-align:center;
}

.hero-title{
  font-size:28px;
  font-weight:bold;
  color:#344E41;
  margin-bottom:8px;
}

.hero-sub{
  color:#6B705C;
  font-size:14px;
  line-height:1.8;
}

.search-box{
  margin:0 16px 16px;
  background:white;
  border-radius:20px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.search-box input{
  border:none;
  outline:none;
  flex:1;
  background:transparent;
  font-size:15px;
  color:#2F3E46;
}

.offers-list{
  padding:0 16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.offer-card{
  background:white;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.05);
  position:relative;
}

.offer-img{
  width:100%;
  height:170px;
  object-fit:cover;
  display:block;
  background:#EDE0D4;
}

.offer-badge{
  position:absolute;
  top:12px;
  right:12px;
  background:#344E41;
  color:white;
  padding:7px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
}

.store-badge{
  position:absolute;
  top:12px;
  left:12px;
  background:white;
  color:#344E41;
  padding:7px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
}

.offer-content{
  padding:15px;
}

.offer-title{
  font-size:20px;
  font-weight:bold;
  color:#344E41;
  margin-bottom:6px;
}

.offer-store{
  color:#6B705C;
  font-size:14px;
  margin-bottom:10px;
}

.price-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.old-price{
  color:#999;
  text-decoration:line-through;
  font-size:14px;
}

.new-price{
  color:#344E41;
  font-weight:bold;
  font-size:22px;
}

.offer-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.btn{
  border:none;
  border-radius:15px;
  padding:12px;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

.primary{
  background:#344E41;
  color:white;
}

.secondary{
  background:#EDE0D4;
  color:#344E41;
}

.empty{
  background:white;
  margin:0 16px;
  border-radius:22px;
  padding:28px 18px;
  text-align:center;
  color:#777;
  line-height:1.8;
}

.toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#344E41;
  color:white;
  padding:12px 18px;
  border-radius:14px;
  opacity:0;
  transition:.3s;
  z-index:9999;
  min-width:220px;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-top:1px solid #e8dfcf;
  z-index:999;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item div{
  font-size:20px;
  margin-bottom:4px;
}

.nav-item.active{
  color:#344E41;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <button class="back-btn" onclick="history.back()">→</button>
    <div>العروض</div>
    <div style="width:38px"></div>
  </div>

  <div class="hero">
    <div class="hero-title">عروض اليوم 🔥</div>
    <div class="hero-sub">اختاري من عروض المتاجر المتاحة قبل انتهاء مدتها.</div>
  </div>

  <div class="search-box">
    <span>🔍</span>
    <input id="searchInput" placeholder="ابحثي عن عرض أو متجر">
  </div>

  <div class="offers-list" id="offersContainer">
    <div class="empty">جاري تحميل العروض...</div>
  </div>

</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="window.location.href='index.html'">
    <div>🏠</div>
    <span>الرئيسية</span>
  </div>

  <div class="nav-item" onclick="window.location.href='orders.html'">
    <div>📦</div>
    <span>طلباتي</span>
  </div>

  <div class="nav-item" onclick="window.location.href='cart.html'">
    <div>🛒</div>
    <span>السلة</span>
  </div>

  <div class="nav-item" onclick="window.location.href='profile.html'">
    <div>👤</div>
    <span>حسابي</span>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const offersContainer = document.getElementById("offersContainer");
const searchInput = document.getElementById("searchInput");

let offersData = [];

function showToast(message){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1800);
}

function formatPrice(value){
  return Number(value || 0).toFixed(2);
}

function getCart(){
  return JSON.parse(sessionStorage.getItem("cart")) || [];
}

function saveCart(cart){
  sessionStorage.setItem("cart", JSON.stringify(cart));
}

function addOfferToCart(product){
  if (!product.store_is_active) {
    showToast("المتجر مغلق حاليًا");
    return;
  }

  let cart = getCart();

  if (cart.length > 0 && String(cart[0].store_id) !== String(product.store_id)) {
    showToast("لا يمكن الطلب من أكثر من متجر");
    return;
  }

  const existing = cart.find(item => String(item.product_id) === String(product.id));

  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({
      id: product.id,
      product_id: product.id,
      name: product.name,
      price: Number(product.offer_price || product.price),
      image: product.image,
      store_id: product.store_id,
      restaurant: product.store_id,
      qty: 1
    });
  }

  saveCart(cart);
  showToast("تمت إضافة العرض للسلة");
}

function renderOffers(){
  const q = searchInput.value.trim().toLowerCase();

  const list = offersData.filter(item => {
    const productName = (item.name || "").toLowerCase();
    const storeName = (item.store_name || "").toLowerCase();
    const offerTitle = (item.offer_title || "").toLowerCase();

    return productName.includes(q) || storeName.includes(q) || offerTitle.includes(q);
  });

  if (!list.length) {
    offersContainer.innerHTML = `<div class="empty">لا توجد عروض مطابقة</div>`;
    return;
  }

  offersContainer.innerHTML = "";

  list.forEach(item => {
    const card = document.createElement("div");
    card.className = "offer-card";

    card.innerHTML = `
      <img class="offer-img" src="${item.image || ""}" onerror="this.src='images/dolce1.jpg.jpg'">

      <div class="offer-badge">${item.offer_title || "عرض خاص"}</div>
      <div class="store-badge">${item.store_name || "متجر"}</div>

      <div class="offer-content">
        <div class="offer-title">${item.name}</div>
        <div class="offer-store">${item.store_is_active ? "🟢 المتجر مفتوح" : "🔴 المتجر مغلق"}</div>

        <div class="price-row">
          <div class="old-price">${formatPrice(item.old_price || item.price)} د.ل</div>
          <div class="new-price">${formatPrice(item.offer_price)} د.ل</div>
        </div>

        <div class="offer-actions">
          <button class="btn secondary" onclick="window.location.href='store.html?id=${item.store_id}'">فتح المتجر</button>
          <button class="btn primary" onclick='addOfferToCart(${JSON.stringify(item)})'>إضافة للسلة</button>
        </div>
      </div>
    `;

    offersContainer.appendChild(card);
  });
}

async function loadOffers(){
  try {
    const res = await fetch("/api/offers");
    const data = await res.json();

    if (!res.ok) {
      offersContainer.innerHTML = `<div class="empty">فشل تحميل العروض</div>`;
      return;
    }

    offersData = Array.isArray(data) ? data : [];
    renderOffers();
  } catch (err) {
    console.error(err);
    offersContainer.innerHTML = `<div class="empty">فشل الاتصال بالسيرفر</div>`;
  }
}

searchInput.addEventListener("input", renderOffers);

loadOffers();
</script>

</body>
</html>
